[project]
name = "daily-report-generator"
version = "0.1.0"
description = "智能日报生成器 —— 采集 GitHub 提交、飞书任务与群消息，生成结构化日报并推送"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    # IANA 时区数据库（ADR-005）。Windows 不自带系统时区库，
    # 缺它时 ZoneInfo("Asia/Shanghai") 会抛 ZoneInfoNotFoundError。
    "tzdata>=2024.1",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["collector", "generator", "notifier", "shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --tb=short"
filterwarnings = ["error::DeprecationWarning"]
